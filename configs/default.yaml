# Paper 1 — default pipeline config.
# Cross-reference: methodology.md sections in inline comments.

seed: 42                          # master split seed (§2.5, §1.4 Step 4)

trajectories:
  n: 200                          # §2.5
  splits: [140, 30, 30]           # train / val / test (§2.5, §5.1 Task B)
  stage_order: [D11, D30, D52]

paths:
  jerber_h5ad:        data/raw/jerber_2021_filtered.h5ad      # §1.1
  hpa_proteomics:     data/raw/proteinatlas_v23_0.tsv         # §1.2.1
  depmap_proteomics:  data/raw/depmap_24q2_proteomics.csv     # §1.2.2
  phosphositeplus:    data/raw/phosphositeplus_ms_cst.tsv     # §1.3
  replogle_h5ad:      data/raw/replogle_2022_k562.h5ad        # §1.2.3
  uniprot_cache:      data/cache/uniprot_idmap.json           # §1.4 Step 1
  artifacts:          artifacts/                              # outputs

provenance:
  manifest_dir: artifacts/provenance/                          # §3
  enable_chain: false                                          # opt-in (§3.3)

mofa:
  n_factors: 5                    # §4.2
  seed: 42                        # M-J: explicit MOFA+ seed

models:
  # M-J: explicit seeds for every stochastic model
  logistic_regression: { random_state: 42 }
  random_forest:       { random_state: 42, n_estimators: 200 }
  ridge:               { random_state: 42, alpha: 1.0 }
  transformer:
    random_state: 42
    d_model: 32
    n_heads: 2
    n_layers: 2
    dropout: 0.1
    epochs: 100
    lr: 1.0e-3

benchmark:
  # M-F: permutation null for Task A — shuffles Pr/Ph across cells.
  task_a_run_permutation_null: true
  # M-H: cross-validated metrics, not single-split, given N=200.
  cv_folds: 5
